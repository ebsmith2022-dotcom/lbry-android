
apply plugin: 'com.android.application'

// Public community service. Override with loopback only for isolated debug tests.
def sponsorBase = providers.gradleProperty('sponsorBaseUrl').getOrElse('https://lbrycommunity-ads.duckdns.org')
if (sponsorBase && !(sponsorBase ==~ /https:\/\/[^\s"\\]+/ || sponsorBase ==~ /http:\/\/127\.0\.0\.1(:[0-9]+)?/)) {
    throw new GradleException('sponsorBaseUrl must be HTTPS, or debug loopback HTTP.')
}

android {
    namespace 'io.lbry.browser'
    compileSdk 37
    buildFeatures { buildConfig true; resValues true }
    // Only unchanged upstream translation findings are baselined; code checks remain enabled.
    lint { baseline = file("lint-baseline-translations.xml") }
    flavorDimensions "default"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.ebsmith2022.lbrycommunity"
        minSdkVersion 21
        targetSdkVersion 36
        buildConfigField "String", "SPONSOR_BASE_URL", groovy.json.JsonOutput.toJson(sponsorBase)
        versionCode 1708
        versionName "0.18.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'lib/x86_64/darwin/libscrypt.dylib'
    }

    productFlavors {
        __32bit {
            versionCode android.defaultConfig.versionCode * 10 + 1
            ndk {
                abiFilter "armeabi-v7a"
            }
        }
        __64bit {
            minSdkVersion 24
            // Refresh the extracted SDK code when installing over an earlier debug APK.
            resValue 'string', 'private_version', '0.102.0-play-1'
            versionCode android.defaultConfig.versionCode * 10 + 4
            ndk {
                abiFilter "arm64-v8a"
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-community"
            Properties twitterProps = new Properties()
            if (project.file('twitter.properties').exists()) {
                project.file('twitter.properties').withInputStream { twitterProps.load(it) }
            }
            resValue "string", "TWITTER_CONSUMER_KEY",  "\"${twitterProps.getProperty("twitterConsumerKey", "")}\""
            resValue "string", "TWITTER_CONSUMER_SECRET", "\"${twitterProps.getProperty("twitterConsumerSecret", "")}\""
        }
        release {
            buildConfigField "String", "SPONSOR_BASE_URL", groovy.json.JsonOutput.toJson(sponsorBase.startsWith("https://") ? sponsorBase : "")
            versionNameSuffix "-community"
            Properties twitterProps = new Properties()
            if (project.file('twitter.properties').exists()) {
                project.file('twitter.properties').withInputStream { twitterProps.load(it) }
            }
            resValue "string", "TWITTER_CONSUMER_KEY",  "\"${twitterProps.getProperty("twitterConsumerKey", "")}\""
            resValue "string", "TWITTER_CONSUMER_SECRET", "\"${twitterProps.getProperty("twitterConsumerSecret", "")}\""
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

task printVersionName {
    doLast {
        println android.defaultConfig.versionName
    }
}

configurations {
    all {
        exclude module: 'httpclient'
        exclude module: 'commons-logging'
    }
}

def androidSdk64 = 'io.lbry:lbrysdk64:0.102.0'
def walletSdkArchive = configurations.create('walletSdkArchive') {
    canBeConsumed = false
    transitive = false
}
def patchedSdkAssets = layout.buildDirectory.dir('generated/lbrySdkAssets')
def sdkPatchScript = rootProject.file('scripts/patch-android-sdk.py')

def patchWalletSdk = tasks.register('patchWalletSdk', Exec) {
    inputs.file(sdkPatchScript)
    inputs.files(walletSdkArchive)
    outputs.dir(patchedSdkAssets)
    doFirst {
        commandLine 'python3', sdkPatchScript, walletSdkArchive.singleFile,
                patchedSdkAssets.get().file('private.mp3').asFile
    }
}

android.sourceSets.__64bit.assets.srcDir(patchedSdkAssets.get().asFile)
androidComponents {
    beforeVariants(selector().all()) { variant ->
        if (!variant.productFlavors.any { it.second == '__64bit' }) variant.enable = false
    }
}
tasks.named('preBuild').configure { dependsOn(patchWalletSdk) }

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.3.0-alpha01'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.3.0-alpha01'
    implementation "androidx.cardview:cardview:1.0.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.navigation:navigation-fragment:2.3.1'
    implementation 'androidx.navigation:navigation-ui:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.webkit:webkit:1.4.0-rc01'
    implementation 'androidx.camera:camera-core:1.0.0-beta03'
    implementation 'androidx.camera:camera-camera2:1.0.0-beta03'
    implementation 'androidx.camera:camera-lifecycle:1.0.0-beta03'
    implementation 'androidx.camera:camera-view:1.0.0-alpha10'
    implementation 'androidx.browser:browser:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.4.1'
    implementation 'com.google.firebase:firebase-analytics:18.0.0'
    implementation 'com.google.android.gms:play-services-base:17.5.0'
    implementation 'com.google.firebase:firebase-messaging:21.0.0'
    implementation 'com.google.oauth-client:google-oauth-client:1.30.4'

    implementation 'androidx.core:core:1.15.0'

    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation 'com.google.android.exoplayer:extension-cast:2.19.1'
    implementation 'com.google.android.exoplayer:extension-mediasession:2.19.1'

    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    implementation 'com.github.hbb20:countrycodepickerproject:v2.7.0'

    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.atlassian.commonmark:commonmark:0.14.0'

    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:7.1.7'
    runtimeOnly 'com.arthenica:smart-exception-java:0.2.1'

    implementation 'commons-codec:commons-codec:1.15'
    implementation 'org.bitcoinj:bitcoinj-tools:0.14.7'
    implementation 'org.java-websocket:Java-WebSocket:1.5.1'

    implementation ('com.journeyapps:zxing-android-embedded:4.1.0') { transitive = false }
    implementation 'com.google.zxing:core:3.3.0'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'


    __64bitImplementation project(':sdk')
    add('walletSdkArchive', "${androidSdk64}@aar")
    //__64bitImplementation(name: 'lbrysdk', ext: 'aar')
}

// Enable Firebase only after adding this fork's own registered project configuration.
if (providers.gradleProperty('enableFirebase').getOrElse('false').toBoolean()) {
    apply plugin: 'com.google.gms.google-services'
}
