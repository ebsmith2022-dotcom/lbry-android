limit_req_zone $binary_remote_addr zone=sponsor_clients:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sponsor_logins:1m rate=5r/m;
limit_req_zone $server_name zone=sponsor_total:1m rate=100r/s;
limit_req_zone $binary_remote_addr zone=community_likes:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=sponsor_connections:10m;
server {
 listen 80 default_server;
 server_name _;
 return 444;
}
server {
 listen 80;
 server_name lbrycommunity-ads.duckdns.org;
 location /.well-known/acme-challenge/ { root /var/www/acme; }
 location / { return 301 https://lbrycommunity-ads.duckdns.org$request_uri; }
 access_log off;
}
server {
 listen 443 ssl default_server;
 server_name _;
 ssl_reject_handshake on;
}
server {
 listen 443 ssl;
 server_name lbrycommunity-ads.duckdns.org;
 ssl_certificate /etc/letsencrypt/live/lbrycommunity-ads.duckdns.org/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/lbrycommunity-ads.duckdns.org/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 add_header Strict-Transport-Security 'max-age=31536000' always;
 client_max_body_size 3m;
 client_body_timeout 15s;
 client_header_timeout 15s;
 keepalive_timeout 30s;
 limit_req_status 429;
 limit_conn_status 429;
 limit_conn sponsor_connections 20;
 limit_req zone=sponsor_clients burst=30 nodelay;
 limit_req zone=sponsor_total burst=100 nodelay;
 access_log off;
 error_log /var/log/nginx/sponsors-error.log error;
 proxy_set_header Host lbrycommunity-ads.duckdns.org;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header X-Forwarded-Proto https;
 proxy_connect_timeout 5s;
 proxy_read_timeout 30s;
 location = /api/login {
  limit_req zone=sponsor_logins burst=5 nodelay;
  limit_req zone=sponsor_total burst=100 nodelay;
  proxy_pass http://127.0.0.1:8787;
 }
 location /v1/likes/ {
  limit_req zone=community_likes burst=20 nodelay;
  limit_req zone=sponsor_total burst=100 nodelay;
  proxy_pass http://127.0.0.1:8787;
 }
 location / { proxy_pass http://127.0.0.1:8787; }
}
